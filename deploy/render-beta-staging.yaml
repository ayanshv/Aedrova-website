# Isolated beta staging. No production credentials, checkout or public downloads.
services:
  - type: web
    name: aedrova-beta-staging
    runtime: docker
    plan: free
    region: oregon
    branch: codex/bud-connectors-https
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m scripts.serve
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    envVars:
      - key: AEDROVA_DEPLOYMENT_ENVIRONMENT
        value: "staging"
      - key: AEDROVA_PRODUCTION
        value: "true"
      - key: AEDROVA_ORIGIN
        sync: false
      - key: AEDROVA_SUPABASE_URL
        value: "https://scvmvqlzcqhwrrsiahpj.supabase.co"
      - key: AEDROVA_SUPABASE_KEY
        value: "sb_publishable_rqwoqVho3GvJxWu0j3mz3Q_zdOVdLF-"
      - key: AEDROVA_DATABASE
        sync: false
      - key: AEDROVA_SUPABASE_DATABASE
        value: "true"
      - key: AEDROVA_DB_POOL_SIZE
        value: "1"
      - key: AEDROVA_DB_MAX_OVERFLOW
        value: "0"
      - key: AEDROVA_ENCRYPTION_KEY
        sync: false
      - key: AEDROVA_WAITLIST_ONLY
        value: "false"
      - key: AEDROVA_DOTS_ENABLED
        value: "true"
      - key: AEDROVA_CHECKOUT_ENABLED
        value: "false"
      - key: AEDROVA_GATEWAY_ENABLED
        value: "false"
      - key: AEDROVA_DEVELOPMENT_AI
        value: "false"
      - key: AEDROVA_FREE_ENABLED
        value: "false"
      - key: AEDROVA_MEETINGS_ENABLED
        value: "false"
      - key: AEDROVA_MEETING_CONTEXT_ENABLED
        value: "false"
      - key: AEDROVA_SPEECH_ENABLED
        value: "false"
      - key: AEDROVA_RELEASE_READY
        value: "false"
      - key: AEDROVA_LEGAL_READY
        value: "false"
      - key: AEDROVA_STRIPE_TEST_MODE
        value: "false"
