# Initial website deployment only. No paid resources or product release gates are enabled.
# Use the existing Supabase session pooler and restricted website database role.
services:
  - type: web
    name: aedrova-website
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 300
    domains:
      - aedrova.com
    envVars:
      - key: AEDROVA_ORIGIN
        value: https://aedrova.com
      - key: AEDROVA_WAITLIST_ONLY
        value: "true"
      - key: AEDROVA_PRODUCTION
        value: "true"
      - key: AEDROVA_SUPABASE_DATABASE
        value: "true"
      - key: AEDROVA_DB_POOL_SIZE
        value: "2"
      - key: AEDROVA_DB_MAX_OVERFLOW
        value: "1"
      - key: AEDROVA_DATABASE
        sync: false
      - key: AEDROVA_ENCRYPTION_KEY
        sync: false
      - key: AEDROVA_CHECKOUT_ENABLED
        value: "false"
      - key: AEDROVA_GATEWAY_ENABLED
        value: "false"
      - key: AEDROVA_MEETINGS_ENABLED
        value: "false"
      - key: AEDROVA_RELEASE_READY
        value: "false"
      - key: AEDROVA_LEGAL_READY
        value: "false"
      - key: AEDROVA_STRIPE_TEST_MODE
        value: "false"
