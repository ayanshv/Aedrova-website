<div class="mobile-workspace-preview">
  <div class="mobile-preview-bar">
    <span class="wordmark mobile-preview-brand" role="img" aria-label="Aedrova"><img src="/static/brand.png" width="21" height="21" alt="">{% include "brand-wordmark.svg" %}</span>
    <span>Product workspace</span>
    <span class="mobile-preview-label">Example</span>
  </div>
  <div class="mobile-preview-thread">
    <div class="mobile-preview-message">
      <span class="mobile-preview-avatar" aria-hidden="true">M</span>
      <div><strong>Maya</strong><p>Can we add a preview before files are sent?</p></div>
    </div>
    <div class="mobile-preview-message">
      <span class="site-bud look-builder" aria-hidden="true"></span>
      <div><strong>Builder Bud</strong><p>I’ve prepared the change for review.</p></div>
    </div>
    <details class="mobile-preview-review">
      <summary><span aria-hidden="true">✓</span> Preview ready to review</summary>
      <p>Files appear above the draft. Teammates can remove them before sending.</p>
    </details>
  </div>
</div>
