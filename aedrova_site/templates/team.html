<section class="team-section reveal" id="meet-the-team" aria-labelledby="team-heading">
  <div class="team-hierarchy">
    <div class="team-tier team-tier-founders" aria-labelledby="team-tier-founders">
    <h3 class="team-tier-label" id="team-tier-founders">Founders</h3>
    <div class="team-grid">
    {% for member in team_members %}
    <article class="team-member" id="{{ member.name | lower | replace(' ', '-') }}" aria-labelledby="team-member-founders-{{ loop.index }}">
      {% if member.photo %}
      <div class="team-portrait"><img class="team-photo" src="{{ member.photo }}" alt="{{ member.name }}, {{ member.role }} of Aedrova" width="{{ member.photo_width }}" height="{{ member.photo_height }}" loading="lazy" decoding="async"></div>
      {% else %}
      <div class="team-monogram" aria-hidden="true"><span>{{ member.initials }}</span><span class="team-orbit"></span></div>
      {% endif %}
      <div class="team-member-details">
        <h4 id="team-member-founders-{{ loop.index }}">{{ member.name }}</h4>
        <p>{{ member.role }}</p>
        <p class="team-bio">{{ member.bio }}</p>
      </div>
    </article>
    {% endfor %}
    </div>
    </div>
  </div>
</section>
