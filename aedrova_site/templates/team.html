<section class="team-section reveal" id="meet-the-team" aria-labelledby="team-heading">
  <div class="team-intro">
    <span class="eyebrow">THE PEOPLE BEHIND AEDROVA</span>
    <h2 id="team-heading">Meet the team.</h2>
    <p>Building a calmer place for people, ideas and tools to work together.</p>
    <a class="text-link" href="/support">Talk to us <span aria-hidden="true">↗</span></a>
  </div>
  <div class="team-grid">
    {% for member in team_members %}
    <article class="team-member" aria-labelledby="team-member-{{ loop.index }}">
      <div class="team-monogram" aria-hidden="true"><span>{{ member.initials }}</span><span class="team-orbit"></span></div>
      <div class="team-member-details">
        <h3 id="team-member-{{ loop.index }}">{{ member.name }}</h3>
        <p>{{ member.role }}</p>
      </div>
    </article>
    {% endfor %}
  </div>
</section>
