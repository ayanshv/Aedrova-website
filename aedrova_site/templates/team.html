<section class="team-section reveal" id="meet-the-team" aria-labelledby="team-heading">
  <div class="team-hierarchy">
    {% for tier, title in [("founders", "Founders"), ("communications", "Communications")] %}
    <div class="team-tier team-tier-{{ tier }}" aria-labelledby="team-tier-{{ tier }}">
    <h3 class="team-tier-label" id="team-tier-{{ tier }}">{{ title }}</h3>
    <div class="team-grid">
    {% for member in team_members if member.tier == tier %}
    <article class="team-member" aria-labelledby="team-member-{{ tier }}-{{ loop.index }}">
      {% if member.photo %}
      <div class="team-portrait"><img class="team-photo-ayansh" src="{{ member.photo }}" alt="Ayansh Varma, Founder and CEO / CTO of Aedrova" width="1008" height="1344" loading="lazy" decoding="async"></div>
      {% else %}
      <div class="team-monogram" aria-hidden="true"><span>{{ member.initials }}</span><span class="team-orbit"></span></div>
      {% endif %}
      <div class="team-member-details">
        <h4 id="team-member-{{ tier }}-{{ loop.index }}">{{ member.name }}</h4>
        <p>{{ member.role }}</p>
      </div>
    </article>
    {% endfor %}
    </div>
    </div>
    {% endfor %}
  </div>
</section>
